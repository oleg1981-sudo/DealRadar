# Scheduled AWIN feed ingestion.
#
# AWIN ships one large combined product feed (gzipped CSV), not a search API, so
# it is ingested here on a schedule rather than via /api/refresh. This downloads
# the feed, keeps genuine in-stock discounts, and upserts them into Supabase.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AWIN_FEED_URL              the datafeed download URL (embeds the API key — secret)
#   SUPABASE_URL               your Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  service-role key (server-only, bypasses RLS)
#
# Run it manually any time from the Actions tab ("Run workflow"); tick "dry_run"
# to preview without writing.
name: Ingest AWIN feed

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC (low-traffic window)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Supabase writes)'
        type: boolean
        default: false

# Shared data-plane group [FR-3.4 follow-up]: ingest and verify write the
# same table — running them concurrently pushed bulk upserts past the
# statement timeout (run 29687440346). The crons never overlap; this makes
# manual dispatches queue instead of colliding.
concurrency:
  group: awin-data-plane
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository_owner == 'oleg1981-sudo'
    runs-on: ubuntu-latest
    # 15 min killed ~half the runs (2026-08-08/11/12/15 all died at 918-920s,
    # i.e. the ceiling itself) while healthy runs finish in ~660s. A kill here
    # is not just a red badge: the job dies mid-upsert AND never reaches the
    # snapshot-prices step below, so the catalog refresh is partial that day.
    # Same growth that took verify-awin 30 -> 150. 45 keeps ~4x headroom over a
    # healthy run while still bounding a runaway one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The script is dependency-free (Node built-ins + Supabase REST), so no install step.
      - name: Run AWIN ingestion
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/ingest-awin.cjs
          else
            node scripts/ingest-awin.cjs --upsert
          fi

      # New variants of known-buggy merchant pages (price swaps after JS) must
      # inherit the homepage exclusion — the ingest alone leaves them visible.
      - name: Sync homepage-hidden flags
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/flag-homepage-hidden.cjs
          else
            node scripts/flag-homepage-hidden.cjs --apply
          fi

      # Record today's prices into price_history (real cardiogram data). The
      # verify workflow re-snapshots the same UTC day later with live-checked
      # prices — idempotent upsert, so that pass wins.
      - name: Snapshot prices into price_history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/snapshot-prices.cjs
          else
            node scripts/snapshot-prices.cjs --apply
          fi

      # Ping IndexNow with visible deals this run touched (new deals, price
      # changes) so Bing/Yandex/Seznam/Naver re-crawl within minutes. Hidden
      # PDPs serve 200+noindex (Q-1) and are excluded by the submit script
      # (interim FR-3.6). The script retries transient errors; a persistent
      # failure now fails this step. Google gets freshness via sitemap lastmod.
      - name: Submit changed deals to IndexNow
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/indexnow-submit.cjs --since 3

      # Category guard, deliberately LAST and `always()`. The ingest writes a
      # marker instead of exiting non-zero, because failing that step makes
      # GitHub skip everything after it — the price_history snapshot and
      # IndexNow ping both stopped for two days (2026-08-21/22) when it did.
      # The data pipeline completes; the job still goes red until a rule exists.
      - name: Fail if a merchant published with no category rules
        if: always()
        run: |
          if [ -f .uncategorised-merchants ]; then
            echo "::error::A merchant's rows were defaulted to \"electronics\" because no category rule matched. See the ingestion step's log for the merchant name and sample products, then add an ADVERTISER_CATEGORY or NAME_CATEGORY_OVERRIDES rule in scripts/ingest-awin.cjs. Do NOT widen a regex until the error stops — read the product names (see CLAUDE.md)."
            exit 1
          fi
          echo "every merchant matched a category rule"
